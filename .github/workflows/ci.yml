name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Confirm toolchain pin
        run: cargo --version && rustc --version

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Count contract crates
        id: crates
        run: echo "count=$(find contracts -mindepth 2 -maxdepth 2 -name Cargo.toml 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Format check
        run: |
          if [ "${{ steps.crates.outputs.count }}" -eq 0 ]; then
            echo "No contract crates yet (Phase 0); format gate activates with the first crate in Phase 1."
          else
            cargo fmt --all --check
          fi

      - name: Clippy (warnings denied)
        run: |
          if [ "${{ steps.crates.outputs.count }}" -eq 0 ]; then
            echo "No contract crates yet (Phase 0); clippy gate activates with the first crate in Phase 1."
          else
            cargo clippy --workspace --all-targets -- -D warnings
          fi

      - name: Build
        run: |
          if [ "${{ steps.crates.outputs.count }}" -eq 0 ]; then
            echo "No contract crates yet (Phase 0); build gate activates with the first crate in Phase 1."
          else
            cargo build --workspace
          fi

      - name: Test
        run: |
          if [ "${{ steps.crates.outputs.count }}" -eq 0 ]; then
            echo "No contract crates yet (Phase 0); test gate activates with the first crate in Phase 1."
          else
            cargo test --workspace
          fi
