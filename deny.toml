# cargo-deny configuration. The audit CI job activates once Cargo.lock exists.

[advisories]
version = 2
yanked = "deny"
# Transitive, unmaintained-only advisories (no known vulnerability) pulled in by
# the soroban-sdk and arkworks stacks. Both are compile-time proc-macro helpers
# with no runtime attack surface, we do not depend on either directly, and there
# is no maintained drop-in. Revisit when soroban-sdk stops pulling them in.
ignore = [
    "RUSTSEC-2024-0436", # paste 1.0.15 is unmaintained (via soroban-sdk)
    "RUSTSEC-2024-0388", # derivative 2.2.0 is unmaintained (via arkworks)
]

[licenses]
version = 2
# Unicode-3.0 is required by unicode-ident (permissive data license for Unicode
# tables, not copyleft). "Apache-2.0 WITH LLVM-exception" is required by wasmparser
# and wasmparser-nostd via the soroban wasmi stack; the LLVM exception only relaxes
# Apache-2.0's attribution requirement when linking, so it is strictly more permissive.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates (common, test-utils) are referenced by path with no
# version, which cargo-deny would otherwise flag as wildcards. They are first
# party code, not an external supply-chain surface.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
