[package]
name = "oracle-adapter"
description = "Publisher registry, signed observation ingestion, median aggregation, and staleness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
test-utils = { path = "../test-utils" }
# Signs the observation payloads in tests so `submit` exercises a real ed25519
# verification. Pinned to match the workspace resolution (DR-0019); dev only,
# never linked into the deployed contract (DR-0024).
ed25519-dalek = "=2.2.0"
